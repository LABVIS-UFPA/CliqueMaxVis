<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Vertex Aggregation Histogram</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #f6f8fb;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			color: #1e2a3a;
			overflow: hidden;
		}

		#app {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			box-sizing: border-box;
			gap: 6px;
		}

		#topBar {
			background: #ffffff;
			border: 1px solid #d9e1ec;
			border-radius: 8px;
			padding: 8px 10px;
		}

		#title {
			margin: 0 0 2px 0;
			font-size: 17px;
			font-weight: 700;
		}

		#status {
			margin: 0;
			font-size: 12px;
			color: #4f647a;
		}

		#selectorBar {
			background: #ffffff;
			border: 1px solid #d9e1ec;
			border-radius: 8px;
			padding: 6px 8px;
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			align-items: center;
		}

		#focusBar {
			background: #ffffff;
			border: 1px solid #d9e1ec;
			border-radius: 8px;
			padding: 6px 8px;
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			align-items: center;
		}

		.check-chip {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			border: 1px solid #d4e1f0;
			background: #f7faff;
			border-radius: 999px;
			padding: 3px 8px;
			font-size: 12px;
			color: #2e4660;
			user-select: none;
			white-space: nowrap;
		}

		.focus-chip {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			border: 1px solid #d4e1f0;
			background: #f8fbff;
			border-radius: 8px;
			padding: 4px 8px;
			font-size: 12px;
			color: #2e4660;
			user-select: none;
			white-space: nowrap;
		}

		.focus-chip input {
			width: 12px;
			height: 12px;
			margin: 0;
			cursor: pointer;
		}

		.focus-button {
			border: 1px solid #c8d5e5;
			background: #ffffff;
			border-radius: 7px;
			color: #2f4d69;
			cursor: pointer;
			font-size: 12px;
			font-weight: 700;
			min-height: 26px;
			padding: 4px 8px;
		}

		.focus-button:hover:not(:disabled) {
			background: #eef5ff;
			border-color: #9db8d6;
		}

		.focus-button:disabled {
			color: #98a8b9;
			cursor: default;
			background: #f4f7fb;
		}

		#selectedList {
			min-width: 160px;
			max-width: 100%;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.check-chip input {
			width: 12px;
			height: 12px;
			margin: 0;
			cursor: pointer;
		}

		.check-label {
			font-weight: 700;
		}

		.check-count {
			color: #5a738d;
			font-size: 11px;
		}

		#chartWrap {
			flex: 1;
			min-height: 200px;
			position: relative;
			overflow: hidden;
			background: #ffffff;
			border: 1px solid #d9e1ec;
			border-radius: 8px;
			padding: 6px;
			box-sizing: border-box;
		}

		#chartsStack {
			height: 100%;
			width: 100%;
			display: grid;
			gap: 6px;
			overflow: auto;
			align-content: stretch;
		}

		.chart-panel {
			position: relative;
			background: #ffffff;
			border: 1px solid #d9e1ec;
			border-radius: 8px;
			overflow: hidden;
			min-height: 170px;
		}

		.chart-canvas {
			width: 100%;
			height: 100%;
			display: block;
			cursor: crosshair;
			touch-action: none;
		}

		.panel-legend {
			position: absolute;
			top: 6px;
			right: 8px;
			background: rgba(255, 255, 255, 0.93);
			border: 1px solid #c7d3e2;
			border-radius: 8px;
			padding: 4px 6px;
			min-width: 250px;
			z-index: 1;
			box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
		}

		.panel-legend-bar {
			height: 9px;
			width: 100%;
			border-radius: 8px;
			border: 1px solid #c6d1e0;
			background: linear-gradient(90deg, #c7cdd6 0%, #9db2c8 30%, #6d97bd 58%, #2f73ab 80%, #164f88 100%);
		}

		.panel-legend-labels {
			margin-top: 2px;
			display: flex;
			justify-content: space-between;
			font-size: 10px;
			color: #40556d;
			font-weight: 600;
		}

		.panel-sort-button {
			border: 1px solid #c8d5e5;
			background: rgba(255, 255, 255, 0.94);
			border-radius: 7px;
			color: #2f4d69;
			cursor: pointer;
			font-size: 11px;
			font-weight: 700;
			min-height: 24px;
			padding: 3px 7px;
		}

		.panel-sort-button:hover {
			background: #eef5ff;
			border-color: #9db8d6;
		}

		.panel-sort-button.active {
			background: #dbeafe;
			border-color: #7aa6d8;
			color: #173f69;
		}

		.panel-sort-button:disabled {
			color: #98a8b9;
			cursor: default;
			background: #f4f7fb;
		}

		.panel-legend-top {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.panel-sort-controls {
			display: inline-flex;
			gap: 4px;
			order: 1;
		}

		.panel-scale-wrap {
			flex: 1;
			order: 2;
			min-width: 140px;
		}

		#emptyState {
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #607991;
			font-size: 13px;
			text-align: center;
			padding: 8px;
			border: 1px dashed #d4deea;
			border-radius: 8px;
			background: #f9fbfd;
		}

		#hoverTooltip {
			position: absolute;
			left: 0;
			top: 0;
			display: none;
			pointer-events: none;
			background: rgba(17, 38, 64, 0.95);
			color: #ffffff;
			border-radius: 6px;
			padding: 6px 8px;
			font-size: 12px;
			line-height: 1.35;
			white-space: pre-line;
			z-index: 4;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
			max-width: 260px;
		}

		@media (max-width: 1024px) {
			#selectorBar {
				gap: 5px;
			}

			#focusBar {
				gap: 5px;
			}

			.check-chip {
				padding: 3px 7px;
			}

			#selectedList {
				flex-basis: 100%;
			}
		}
	</style>
</head>
<body>
	<div id="app">
		<div id="topBar">
			<h3 id="title">Vertex Aggregation Histogram</h3>
			<p id="status">Waiting for data...</p>
		</div>

		<div id="selectorBar">
			<label class="check-chip">
				<input id="chk-total" type="checkbox" checked />
				<span class="check-label">Total</span>
				<span id="count-total" class="check-count">0</span>
			</label>
			<label class="check-chip">
				<input id="chk-top1" type="checkbox" />
				<span class="check-label">Top 1</span>
				<span id="count-top1" class="check-count">0</span>
			</label>
			<label class="check-chip">
				<input id="chk-top2" type="checkbox" />
				<span class="check-label">Top 2</span>
				<span id="count-top2" class="check-count">0</span>
			</label>
			<label class="check-chip">
				<input id="chk-top3" type="checkbox" />
				<span class="check-label">Top 3</span>
				<span id="count-top3" class="check-count">0</span>
			</label>
			<label class="check-chip">
				<input id="chk-others" type="checkbox" />
				<span class="check-label">Others</span>
				<span id="count-others" class="check-count">0</span>
			</label>
		</div>

		<div id="focusBar">
			<span id="selectedSummary" class="focus-chip">Selected vertices: 0</span>
			<label class="focus-chip">
				<input id="chk-focus-selected" type="checkbox" disabled />
				<span>Show selected only</span>
			</label>
			<button id="btn-clear-selection" class="focus-button" type="button" disabled>Clear</button>
			<span id="selectedList" class="focus-chip">Click or drag over bars to select vertices.</span>
		</div>

		<div id="chartWrap">
			<div id="chartsStack"></div>
			<div id="hoverTooltip"></div>
		</div>
	</div>

	<script type="module">
		import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

		const GROUP_CONFIG = [
			{ key: "total", label: "Total" },
			{ key: "top1", label: "Top 1" },
			{ key: "top2", label: "Top 2" },
			{ key: "top3", label: "Top 3" },
			{ key: "others", label: "Others" }
		];

		const GROUP_LABELS = GROUP_CONFIG.reduce((acc, cur) => {
			acc[cur.key] = cur.label;
			return acc;
		}, {});

		const ORDERING_SOURCE = "histogram_aggregation_vis";

		const chartWrapEl = document.getElementById("chartWrap");
		const chartsStackEl = document.getElementById("chartsStack");
		const hoverTooltipEl = document.getElementById("hoverTooltip");
		const statusEl = document.getElementById("status");
		const focusSelectedCheckbox = document.getElementById("chk-focus-selected");
		const selectedSummaryEl = document.getElementById("selectedSummary");
		const selectedListEl = document.getElementById("selectedList");
		const clearSelectionButton = document.getElementById("btn-clear-selection");

		const checkboxes = {
			total: document.getElementById("chk-total"),
			top1: document.getElementById("chk-top1"),
			top2: document.getElementById("chk-top2"),
			top3: document.getElementById("chk-top3"),
			others: document.getElementById("chk-others")
		};

		const countEls = {
			total: document.getElementById("count-total"),
			top1: document.getElementById("count-top1"),
			top2: document.getElementById("count-top2"),
			top3: document.getElementById("count-top3"),
			others: document.getElementById("count-others")
		};

		const colorScale = d3.scaleSequential(
			d3.interpolateRgbBasis(["#c7cdd6", "#9db2c8", "#6d97bd", "#2f73ab", "#164f88"])
		);

		let vertexCount = 0;
		let processedGenerations = 0;
		let currentGeneration = 0;
		let drawScheduled = false;
		let selectedVertices = new Set();
		let selectionAnchorVertex = null;
		let coordinatedVertexOrder = [];
		let coordinatedOrderLocked = false;
		let pendingOrderingPayload = null;
		let lastBroadcastOrderingSignature = "";
		let socket = null;
		let coordinatedSort = {
			key: null,
			direction: "vertex"
		};

		let counters = {
			total: 0,
			top1: 0,
			top2: 0,
			top3: 0,
			others: 0
		};

		let raceFitness = {
			top1: null,
			top2: null,
			top3: null
		};

		let accumulators = {
			total: [],
			top1: [],
			top2: [],
			top3: [],
			others: []
		};

		const panelStateByKey = new Map();

		function createZeroArray(size) {
			return Array.from({ length: size }, () => 0);
		}

		function resetAccumulatorState(newVertexCount = vertexCount) {
			vertexCount = newVertexCount;
			accumulators = {
				total: createZeroArray(vertexCount),
				top1: createZeroArray(vertexCount),
				top2: createZeroArray(vertexCount),
				top3: createZeroArray(vertexCount),
				others: createZeroArray(vertexCount)
			};
			counters = {
				total: 0,
				top1: 0,
				top2: 0,
				top3: 0,
				others: 0
			};
			raceFitness = {
				top1: null,
				top2: null,
				top3: null
			};
			processedGenerations = 0;
			currentGeneration = 0;
			selectedVertices.clear();
			selectionAnchorVertex = null;
			resetHistogramSortDirections();
			updateFocusControls();
		}

		function ensureAccumulatorSize(size) {
			if (size !== vertexCount) {
				resetAccumulatorState(size);
			}
		}

		function addMaskToAccumulator(target, nodeMask) {
			for (let i = 0; i < nodeMask.length; i++) {
				target[i] += nodeMask[i] ? 1 : 0;
			}
		}

		function addAccumulatorToAccumulator(target, source) {
			for (let i = 0; i < target.length && i < source.length; i++) {
				target[i] += source[i];
			}
		}

		function shiftRacePodiumForNewLeader(newTopFitness) {
			if (raceFitness.top3 !== null) {
				addAccumulatorToAccumulator(accumulators.others, accumulators.top3);
				counters.others += counters.top3;
			}

			accumulators.top3 = accumulators.top2.slice();
			counters.top3 = counters.top2;
			raceFitness.top3 = raceFitness.top2;

			accumulators.top2 = accumulators.top1.slice();
			counters.top2 = counters.top1;
			raceFitness.top2 = raceFitness.top1;

			accumulators.top1 = createZeroArray(vertexCount);
			counters.top1 = 0;
			raceFitness.top1 = newTopFitness;
		}

		function getGenerationMaxFitness(population) {
			let maxFitness = null;

			for (const individual of population) {
				if (!individual || !Array.isArray(individual.nodeMask)) continue;
				const fitness = Number(individual.fitness ?? 0);
				if (maxFitness === null || fitness > maxFitness) {
					maxFitness = fitness;
				}
			}

			return maxFitness;
		}

		function initializeRacePodium(population) {
			const fitnessValues = [...new Set(population
				.filter((individual) => individual && Array.isArray(individual.nodeMask))
				.map((individual) => Number(individual.fitness ?? 0)))]
				.sort((a, b) => b - a);

			raceFitness.top1 = fitnessValues[0] ?? null;
			raceFitness.top2 = fitnessValues[1] ?? null;
			raceFitness.top3 = fitnessValues[2] ?? null;
		}

		function classifyPopulation(population) {
			const generationMaxFitness = getGenerationMaxFitness(population);
			if (generationMaxFitness === null) return;

			if (raceFitness.top1 === null) {
				initializeRacePodium(population);
			} else if (generationMaxFitness > raceFitness.top1) {
				shiftRacePodiumForNewLeader(generationMaxFitness);
			}

			for (const individual of population) {
				if (!individual || !Array.isArray(individual.nodeMask)) continue;
				const fitness = Number(individual.fitness ?? 0);

				let bucket = "others";
				if (raceFitness.top1 !== null && fitness === raceFitness.top1) bucket = "top1";
				else if (raceFitness.top2 !== null && fitness === raceFitness.top2) bucket = "top2";
				else if (raceFitness.top3 !== null && fitness === raceFitness.top3) bucket = "top3";

				addMaskToAccumulator(accumulators[bucket], individual.nodeMask);
				addMaskToAccumulator(accumulators.total, individual.nodeMask);
				counters[bucket] += 1;
				counters.total += 1;
			}
		}

		function updateCounts() {
			countEls.total.textContent = String(counters.total);
			countEls.top1.textContent = String(counters.top1);
			countEls.top2.textContent = String(counters.top2);
			countEls.top3.textContent = String(counters.top3);
			countEls.others.textContent = String(counters.others);
		}

		function getSelectedKeys() {
			return GROUP_CONFIG
				.map((group) => group.key)
				.filter((key) => checkboxes[key].checked);
		}

		function resetHistogramSortDirections() {
			coordinatedSort = {
				key: null,
				direction: "vertex"
			};
			coordinatedOrderLocked = false;
			coordinatedVertexOrder = getDefaultVertexOrder();
		}

		function hasSortedHistogram() {
			return coordinatedSort.direction !== "vertex";
		}

		function getDefaultVertexOrder() {
			return Array.from({ length: vertexCount }, (_, index) => index);
		}

		function buildSortedVertexOrder(key, direction) {
			const histogram = accumulators[key] || [];
			return getDefaultVertexOrder().sort((a, b) => {
				const valueA = histogram[a] || 0;
				const valueB = histogram[b] || 0;
				if (direction === "asc") return valueA - valueB || a - b;
				return valueB - valueA || a - b;
			});
		}

		function refreshCoordinatedVertexOrder() {
			if (!hasSortedHistogram()) {
				ensureCoordinatedVertexOrder();
				return;
			}

			if (coordinatedOrderLocked) {
				ensureCoordinatedVertexOrder();
				return;
			}

			coordinatedVertexOrder = buildSortedVertexOrder(coordinatedSort.key, coordinatedSort.direction);
		}

		function getOrderingBroadcastPayload() {
			ensureCoordinatedVertexOrder();
			return {
				source: ORDERING_SOURCE,
				key: coordinatedSort.key,
				direction: coordinatedSort.direction,
				vertexCount,
				vertexOrder: coordinatedVertexOrder.slice()
			};
		}

		function getOrderingSignature(payload) {
			return JSON.stringify({
				key: payload.key,
				direction: payload.direction,
				vertexCount: payload.vertexCount,
				vertexOrder: payload.vertexOrder
			});
		}

		function broadcastOrderingChange(force = false) {
			if (!socket || socket.readyState !== WebSocket.OPEN) return;

			const payload = getOrderingBroadcastPayload();
			const signature = getOrderingSignature(payload);
			if (!force && signature === lastBroadcastOrderingSignature) return;

			lastBroadcastOrderingSignature = signature;
			socket.send(JSON.stringify({ act: "change_ordering", data: payload }));
		}

		function normalizeVertexOrder(vertexOrder, expectedVertexCount) {
			if (!Array.isArray(vertexOrder) || vertexOrder.length !== expectedVertexCount) return null;

			const seen = new Set();
			const normalized = [];

			for (const value of vertexOrder) {
				const index = Number(value);
				if (!Number.isInteger(index) || index < 0 || index >= expectedVertexCount || seen.has(index)) {
					return null;
				}
				seen.add(index);
				normalized.push(index);
			}

			return normalized;
		}

		function applyOrderingPayload(payload) {
			if (!payload || typeof payload !== "object") return false;

			if (payload.direction === "vertex") {
				pendingOrderingPayload = null;
				resetHistogramSortDirections();
			} else {
				const direction = payload.direction === "asc" ? "asc" : payload.direction === "desc" ? "desc" : null;
				if (!direction) return false;

				if (Number(payload.vertexCount) !== vertexCount) {
					pendingOrderingPayload = payload;
					return false;
				}

				const normalizedOrder = normalizeVertexOrder(payload.vertexOrder, vertexCount);
				if (!normalizedOrder) return false;

				coordinatedSort = {
					key: payload.key || null,
					direction
				};
				coordinatedVertexOrder = normalizedOrder;
				coordinatedOrderLocked = true;
			}

			lastBroadcastOrderingSignature = getOrderingSignature(getOrderingBroadcastPayload());
			for (const state of panelStateByKey.values()) {
				updatePanelSortControls(state);
			}
			updateFocusControls();
			scheduleDraw();
			return true;
		}

		function applyPendingOrderingIfReady() {
			if (!pendingOrderingPayload) return;
			if (Number(pendingOrderingPayload.vertexCount) !== vertexCount) return;

			const payload = pendingOrderingPayload;
			pendingOrderingPayload = null;
			applyOrderingPayload(payload);
		}

		function getOrderedSelectedVertices() {
			return [...selectedVertices]
				.filter((index) => index >= 0 && index < vertexCount)
				.sort((a, b) => a - b);
		}

		function formatVertexList(indices) {
			if (!indices.length) return "Click or drag over bars to select vertices.";

			const preview = indices.slice(0, 14).map((index) => index + 1).join(", ");
			const suffix = indices.length > 14 ? `, +${indices.length - 14} more` : "";
			return `Vertices: ${preview}${suffix}`;
		}

		function updateFocusControls() {
			const ordered = getOrderedSelectedVertices();
			const selectedCount = ordered.length;
			const hasFocusState =
				selectedCount > 0 ||
				hasSortedHistogram() ||
				focusSelectedCheckbox.checked;

			selectedSummaryEl.textContent = `Selected vertices: ${selectedCount}`;
			selectedListEl.textContent = formatVertexList(ordered);
			focusSelectedCheckbox.disabled = selectedCount === 0;
			clearSelectionButton.disabled = !hasFocusState;

			if (selectedCount === 0) {
				focusSelectedCheckbox.checked = false;
			}
		}

		function setSelectedVertices(indices, append = false) {
			const next = append ? new Set(selectedVertices) : new Set();

			for (const index of indices) {
				if (index >= 0 && index < vertexCount) next.add(index);
			}

			selectedVertices = next;
			updateFocusControls();
			scheduleDraw();
		}

		function setSelectionAnchor(index) {
			selectionAnchorVertex = index >= 0 && index < vertexCount ? index : null;
		}

		function toggleSelectedVertex(index) {
			const next = new Set(selectedVertices);
			if (next.has(index)) next.delete(index);
			else next.add(index);
			selectedVertices = next;
			updateFocusControls();
			scheduleDraw();
		}

		function selectVertexRange(fromIndex, toIndex, append = false) {
			const start = Math.max(0, Math.min(fromIndex, toIndex));
			const end = Math.min(vertexCount - 1, Math.max(fromIndex, toIndex));
			const indices = [];

			for (let index = start; index <= end; index++) {
				indices.push(index);
			}

			setSelectedVertices(indices, append);
		}

		function ensureCoordinatedVertexOrder() {
			if (coordinatedVertexOrder.length !== vertexCount) {
				coordinatedVertexOrder = getDefaultVertexOrder();
			}
		}

		function getDisplayData(histogram) {
			ensureCoordinatedVertexOrder();

			let displayData = coordinatedVertexOrder.map((vertexIndex) => ({
				vertexIndex,
				value: histogram[vertexIndex] || 0
			}));

			if (focusSelectedCheckbox.checked && selectedVertices.size) {
				displayData = displayData.filter((item) => selectedVertices.has(item.vertexIndex));
			}

			return displayData;
		}

		function updatePanelSortControls(panelState) {
			const isActivePanel = coordinatedSort.key === panelState.key;
			const ascActive = isActivePanel && coordinatedSort.direction === "asc";
			const descActive = isActivePanel && coordinatedSort.direction === "desc";

			panelState.sortAscButton.classList.toggle("active", ascActive);
			panelState.sortDescButton.classList.toggle("active", descActive);
			panelState.sortAscButton.disabled = vertexCount < 2;
			panelState.sortDescButton.disabled = vertexCount < 2;
			panelState.sortAscButton.setAttribute("aria-pressed", String(ascActive));
			panelState.sortDescButton.setAttribute("aria-pressed", String(descActive));
		}

		function setPanelSortDirection(panelState, direction) {
			const isSameSort = coordinatedSort.key === panelState.key && coordinatedSort.direction === direction;
			if (isSameSort) {
				resetHistogramSortDirections();
			} else {
				coordinatedSort = {
					key: panelState.key,
					direction
				};
				coordinatedOrderLocked = false;
				refreshCoordinatedVertexOrder();
			}

			for (const state of panelStateByKey.values()) {
				updatePanelSortControls(state);
			}
			updateFocusControls();
			broadcastOrderingChange(true);
			scheduleDraw();
		}

		function hideTooltip() {
			hoverTooltipEl.style.display = "none";
		}

		function positionTooltip(event) {
			const wrapRect = chartWrapEl.getBoundingClientRect();
			const pointerX = event.clientX - wrapRect.left;
			const pointerY = event.clientY - wrapRect.top;

			let left = pointerX + 12;
			let top = pointerY - hoverTooltipEl.offsetHeight - 8;

			if (left + hoverTooltipEl.offsetWidth > wrapRect.width - 4) {
				left = pointerX - hoverTooltipEl.offsetWidth - 12;
			}
			if (left < 4) left = 4;

			if (top < 4) top = pointerY + 12;
			if (top + hoverTooltipEl.offsetHeight > wrapRect.height - 4) {
				top = Math.max(4, wrapRect.height - hoverTooltipEl.offsetHeight - 4);
			}

			hoverTooltipEl.style.left = `${left}px`;
			hoverTooltipEl.style.top = `${top}px`;
		}

		function drawNoDataMessage(ctx, canvas, message) {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.fillStyle = "#ffffff";
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			ctx.fillStyle = "#5b6f85";
			ctx.font = "13px Segoe UI";
			ctx.fillText(message, 14, 22);
		}

		function drawYAxisAndGrid(ctx, margin, innerWidth, innerHeight, maxValue) {
			ctx.strokeStyle = "#9fb0c4";
			ctx.lineWidth = 1;
			ctx.beginPath();
			ctx.moveTo(margin.left, margin.top);
			ctx.lineTo(margin.left, margin.top + innerHeight);
			ctx.lineTo(margin.left + innerWidth, margin.top + innerHeight);
			ctx.stroke();

			const yScale = d3.scaleLinear()
				.domain([0, Math.max(1, maxValue)])
				.range([margin.top + innerHeight, margin.top]);

			const tickValues = d3.ticks(0, Math.max(1, maxValue), 4);
			ctx.font = "11px Segoe UI";
			ctx.fillStyle = "#5d7289";
			ctx.strokeStyle = "#e5ecf4";

			for (const tick of tickValues) {
				const y = yScale(tick);
				ctx.beginPath();
				ctx.moveTo(margin.left, y);
				ctx.lineTo(margin.left + innerWidth, y);
				ctx.stroke();
				ctx.fillText(String(Math.round(tick)), 8, y + 4);
			}
		}

		function isDisplayIndexInDragRange(panelState, displayIndex) {
			if (!panelState.isPointerDown) return false;
			if (panelState.dragStartDisplayIndex < 0 || panelState.dragCurrentDisplayIndex < 0) return false;

			const min = Math.min(panelState.dragStartDisplayIndex, panelState.dragCurrentDisplayIndex);
			const max = Math.max(panelState.dragStartDisplayIndex, panelState.dragCurrentDisplayIndex);
			return displayIndex >= min && displayIndex <= max;
		}

		function renderPanel(panelState) {
			const { key, canvas, ctx, legendMin, legendMax } = panelState;
			const histogram = accumulators[key] || [];
			const displayData = getDisplayData(histogram);
			updatePanelSortControls(panelState);

			const width = Math.max(320, Math.floor(canvas.clientWidth));
			const height = Math.max(170, Math.floor(canvas.clientHeight));
			canvas.width = width;
			canvas.height = height;

			if (!histogram.length || !displayData.length) {
				legendMin.textContent = "0";
				legendMax.textContent = "0";
				panelState.drawMeta = null;
				const message = histogram.length
					? `No selected vertices to display for ${GROUP_LABELS[key]}.`
					: `No data available for ${GROUP_LABELS[key]}.`;
				drawNoDataMessage(ctx, canvas, message);
				return;
			}

			const margin = { top: 14, right: 16, bottom: 28, left: 52 };
			const innerWidth = canvas.width - margin.left - margin.right;
			const innerHeight = canvas.height - margin.top - margin.bottom;

			if (innerWidth <= 0 || innerHeight <= 0) {
				panelState.drawMeta = null;
				return;
			}

			const maxValue = d3.max(displayData, (item) => item.value) || 0;
			const barWidth = innerWidth / displayData.length;
			colorScale.domain([0, Math.max(1, maxValue)]);

			legendMin.textContent = "0";
			legendMax.textContent = String(maxValue);

			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.fillStyle = "#ffffff";
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			drawYAxisAndGrid(ctx, margin, innerWidth, innerHeight, maxValue);

			for (let i = 0; i < displayData.length; i++) {
				const { vertexIndex } = displayData[i];
				const x = margin.left + i * barWidth;

				if (selectedVertices.has(vertexIndex)) {
					ctx.fillStyle = "rgba(240, 140, 0, 0.13)";
					ctx.fillRect(x, margin.top, Math.max(1, Math.ceil(barWidth)), innerHeight);
				}

				if (isDisplayIndexInDragRange(panelState, i)) {
					ctx.fillStyle = "rgba(37, 99, 235, 0.14)";
					ctx.fillRect(x, margin.top, Math.max(1, Math.ceil(barWidth)), innerHeight);
				}
			}

			for (let i = 0; i < displayData.length; i++) {
				const { value } = displayData[i];
				if (!value) continue;

				const barHeight = (value / Math.max(1, maxValue)) * innerHeight;
				const x = margin.left + i * barWidth;
				const y = margin.top + innerHeight - barHeight;

				ctx.fillStyle = colorScale(value);
				ctx.fillRect(x, y, Math.max(1, Math.ceil(barWidth)), barHeight);
			}

			for (let i = 0; i < displayData.length; i++) {
				const { vertexIndex } = displayData[i];
				if (!selectedVertices.has(vertexIndex)) continue;

				const x = margin.left + i * barWidth;
				ctx.strokeStyle = "#f08c00";
				ctx.lineWidth = 1;
				ctx.strokeRect(
					x + 0.5,
					margin.top + 0.5,
					Math.max(1, Math.ceil(barWidth)) - 1,
					innerHeight - 1
				);
			}

			if (panelState.hoveredIndex >= 0 && panelState.hoveredIndex < displayData.length) {
				const highlightX = margin.left + panelState.hoveredIndex * barWidth + barWidth / 2;
				ctx.strokeStyle = "#f08c00";
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.moveTo(highlightX, margin.top);
				ctx.lineTo(highlightX, margin.top + innerHeight);
				ctx.stroke();
			}

			ctx.fillStyle = "#2f445a";
			ctx.font = "12px Segoe UI";
			ctx.textAlign = "left";

			ctx.fillStyle = "#3b5875";
			ctx.font = "12px Segoe UI";
			ctx.fillText(GROUP_LABELS[key], margin.left + 2, 16);

			panelState.drawMeta = {
				margin,
				innerWidth,
				innerHeight,
				barWidth,
				displayData
			};
		}

		function scheduleDraw() {
			if (drawScheduled) return;
			drawScheduled = true;
			requestAnimationFrame(() => {
				drawScheduled = false;
				refreshCoordinatedVertexOrder();
				if (hasSortedHistogram() && !coordinatedOrderLocked) {
					broadcastOrderingChange();
				}
				for (const panelState of panelStateByKey.values()) {
					renderPanel(panelState);
				}
			});
		}

		function handlePanelHover(event, panelState) {
			if (panelState.isPointerDown) {
				hideTooltip();
				return;
			}

			const meta = panelState.drawMeta;
			if (!meta) {
				hideTooltip();
				return;
			}

			const rect = panelState.canvas.getBoundingClientRect();
			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;

			const { margin, innerWidth, innerHeight, barWidth, displayData } = meta;
			const insidePlot =
				x >= margin.left &&
				x <= margin.left + innerWidth &&
				y >= margin.top &&
				y <= margin.top + innerHeight;

			if (!insidePlot || barWidth <= 0) {
				if (panelState.hoveredIndex !== -1) {
					panelState.hoveredIndex = -1;
					scheduleDraw();
				}
				hideTooltip();
				return;
			}

			const index = Math.floor((x - margin.left) / barWidth);
			if (index < 0 || index >= displayData.length) {
				if (panelState.hoveredIndex !== -1) {
					panelState.hoveredIndex = -1;
					scheduleDraw();
				}
				hideTooltip();
				return;
			}

			const { vertexIndex, value } = displayData[index];
			const selectionText = selectedVertices.has(vertexIndex) ? "\nSelected" : "";
			hoverTooltipEl.textContent = `Vertex ${vertexIndex + 1}\nOccurrences: ${value}\nGroup: ${GROUP_LABELS[panelState.key]}${selectionText}`;
			hoverTooltipEl.style.display = "block";
			positionTooltip(event);

			if (panelState.hoveredIndex !== index) {
				panelState.hoveredIndex = index;
				scheduleDraw();
			}
		}

		function getPointerDisplayIndex(event, panelState) {
			const meta = panelState.drawMeta;
			if (!meta) return -1;

			const rect = panelState.canvas.getBoundingClientRect();
			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;
			const { margin, innerWidth, innerHeight, barWidth, displayData } = meta;

			const insidePlot =
				x >= margin.left &&
				x <= margin.left + innerWidth &&
				y >= margin.top &&
				y <= margin.top + innerHeight;

			if (!insidePlot || barWidth <= 0) return -1;

			const index = Math.floor((x - margin.left) / barWidth);
			if (index < 0 || index >= displayData.length) return -1;
			return index;
		}

		function commitSelectionFromDrag(event, panelState) {
			const meta = panelState.drawMeta;
			if (!meta) return;

			const start = panelState.dragStartDisplayIndex;
			const end = panelState.dragCurrentDisplayIndex;
			if (start < 0 || end < 0) return;

			if (start === end) {
				const vertexIndex = meta.displayData[start].vertexIndex;
				if (event.shiftKey && selectionAnchorVertex !== null) {
					selectVertexRange(selectionAnchorVertex, vertexIndex, event.ctrlKey || event.metaKey);
				} else if (event.ctrlKey || event.metaKey) {
					toggleSelectedVertex(vertexIndex);
				} else {
					setSelectedVertices([vertexIndex]);
				}
				setSelectionAnchor(vertexIndex);
				return;
			}

			const min = Math.min(start, end);
			const max = Math.max(start, end);
			const selectedRange = meta.displayData
				.slice(min, max + 1)
				.map((item) => item.vertexIndex);

			setSelectedVertices(selectedRange, event.ctrlKey || event.metaKey);
			setSelectionAnchor(selectedRange[selectedRange.length - 1]);
		}

		function attachPanelEvents(panelState) {
			panelState.canvas.addEventListener("mousemove", (event) => handlePanelHover(event, panelState));
			panelState.canvas.addEventListener("pointerdown", (event) => {
				const displayIndex = getPointerDisplayIndex(event, panelState);
				if (displayIndex < 0) return;

				panelState.canvas.setPointerCapture(event.pointerId);
				panelState.isPointerDown = true;
				panelState.dragStartDisplayIndex = displayIndex;
				panelState.dragCurrentDisplayIndex = displayIndex;
				panelState.hoveredIndex = displayIndex;
				hideTooltip();
				scheduleDraw();
				event.preventDefault();
			});
			panelState.canvas.addEventListener("pointermove", (event) => {
				if (!panelState.isPointerDown) return;
				const displayIndex = getPointerDisplayIndex(event, panelState);
				if (displayIndex < 0 || displayIndex === panelState.dragCurrentDisplayIndex) return;
				panelState.dragCurrentDisplayIndex = displayIndex;
				panelState.hoveredIndex = displayIndex;
				scheduleDraw();
			});
			panelState.canvas.addEventListener("pointerup", (event) => {
				if (!panelState.isPointerDown) return;
				const displayIndex = getPointerDisplayIndex(event, panelState);
				if (displayIndex >= 0) panelState.dragCurrentDisplayIndex = displayIndex;

				commitSelectionFromDrag(event, panelState);
				panelState.isPointerDown = false;
				panelState.dragStartDisplayIndex = -1;
				panelState.dragCurrentDisplayIndex = -1;
				scheduleDraw();
			});
			panelState.canvas.addEventListener("pointercancel", () => {
				panelState.isPointerDown = false;
				panelState.dragStartDisplayIndex = -1;
				panelState.dragCurrentDisplayIndex = -1;
				scheduleDraw();
			});
			panelState.canvas.addEventListener("mouseleave", () => {
				if (panelState.hoveredIndex !== -1) {
					panelState.hoveredIndex = -1;
					scheduleDraw();
				}
				hideTooltip();
			});
		}

		function createPanel(key) {
			const panelEl = document.createElement("div");
			panelEl.className = "chart-panel";

			const canvas = document.createElement("canvas");
			canvas.className = "chart-canvas";

			const legendEl = document.createElement("div");
			legendEl.className = "panel-legend";

			const legendTopEl = document.createElement("div");
			legendTopEl.className = "panel-legend-top";

			const scaleWrapEl = document.createElement("div");
			scaleWrapEl.className = "panel-scale-wrap";

			const barEl = document.createElement("div");
			barEl.className = "panel-legend-bar";

			const sortControlsEl = document.createElement("div");
			sortControlsEl.className = "panel-sort-controls";

			const sortAscButtonEl = document.createElement("button");
			sortAscButtonEl.className = "panel-sort-button";
			sortAscButtonEl.type = "button";
			sortAscButtonEl.textContent = "Asc";
			sortAscButtonEl.title = "Sort all histograms by this histogram in ascending order";

			const sortDescButtonEl = document.createElement("button");
			sortDescButtonEl.className = "panel-sort-button";
			sortDescButtonEl.type = "button";
			sortDescButtonEl.textContent = "Desc";
			sortDescButtonEl.title = "Sort all histograms by this histogram in descending order";

			sortControlsEl.appendChild(sortAscButtonEl);
			sortControlsEl.appendChild(sortDescButtonEl);
			legendTopEl.appendChild(sortControlsEl);

			const labelsEl = document.createElement("div");
			labelsEl.className = "panel-legend-labels";

			const minEl = document.createElement("span");
			minEl.textContent = "0";

			const maxEl = document.createElement("span");
			maxEl.textContent = "0";

			labelsEl.appendChild(minEl);
			labelsEl.appendChild(maxEl);
			scaleWrapEl.appendChild(barEl);
			scaleWrapEl.appendChild(labelsEl);
			legendTopEl.appendChild(scaleWrapEl);
			legendEl.appendChild(legendTopEl);
			panelEl.appendChild(canvas);
			panelEl.appendChild(legendEl);

			const panelState = {
				key,
				panelEl,
				canvas,
				ctx: canvas.getContext("2d"),
				sortAscButton: sortAscButtonEl,
				sortDescButton: sortDescButtonEl,
				legendMin: minEl,
				legendMax: maxEl,
				hoveredIndex: -1,
				isPointerDown: false,
				dragStartDisplayIndex: -1,
				dragCurrentDisplayIndex: -1,
				drawMeta: null
			};

			sortAscButtonEl.addEventListener("click", (event) => {
				event.stopPropagation();
				setPanelSortDirection(panelState, "asc");
			});
			sortDescButtonEl.addEventListener("click", (event) => {
				event.stopPropagation();
				setPanelSortDirection(panelState, "desc");
			});
			attachPanelEvents(panelState);
			return panelState;
		}

		function rebuildPanels() {
			panelStateByKey.clear();
			chartsStackEl.innerHTML = "";

			const selectedKeys = getSelectedKeys();
			if (!selectedKeys.length) {
				const emptyEl = document.createElement("div");
				emptyEl.id = "emptyState";
				emptyEl.textContent = "Select at least one group to display histograms.";
				chartsStackEl.style.gridTemplateRows = "1fr";
				chartsStackEl.appendChild(emptyEl);
				hideTooltip();
				return;
			}

			chartsStackEl.style.gridTemplateRows = `repeat(${selectedKeys.length}, minmax(170px, 1fr))`;

			for (const key of selectedKeys) {
				const panelState = createPanel(key);
				panelStateByKey.set(key, panelState);
				chartsStackEl.appendChild(panelState.panelEl);
			}
		}

		function refreshLayoutAndDraw() {
			rebuildPanels();
			scheduleDraw();
		}

		for (const key of Object.keys(checkboxes)) {
			checkboxes[key].addEventListener("change", refreshLayoutAndDraw);
		}

		focusSelectedCheckbox.addEventListener("change", scheduleDraw);
		clearSelectionButton.addEventListener("click", () => {
			selectedVertices.clear();
			selectionAnchorVertex = null;
			resetHistogramSortDirections();
			focusSelectedCheckbox.checked = false;
			updateFocusControls();
			broadcastOrderingChange(true);
			scheduleDraw();
		});

		window.addEventListener("resize", scheduleDraw);

		socket = new WebSocket("ws://localhost:3214");

		socket.onopen = function() {
			statusEl.textContent = "Connected to server. Waiting for population data...";
			socket.send(JSON.stringify({ act: "obs", data: ["individuals", "ui_events", "ordering"] }));
		};

		socket.onmessage = function(event) {
			const message = JSON.parse(event.data);

			if (message.act === "resetCharts") {
				resetAccumulatorState(vertexCount);
				hideTooltip();
				statusEl.textContent = "Process reset detected. Accumulators were cleared.";
				updateCounts();
				scheduleDraw();
				return;
			}

			if (message.act === "change_ordering") {
				applyOrderingPayload(message.data);
				return;
			}

			if (message.act !== "data" || message.type !== "individuals") return;
			if (!message.data || !Array.isArray(message.data.population) || message.data.population.length === 0) return;

			const population = message.data.population;
			const maskLength = Array.isArray(population[0].nodeMask) ? population[0].nodeMask.length : 0;
			if (!maskLength) return;

			const incomingGeneration = Number(message.data.generation || (currentGeneration + 1));
			ensureAccumulatorSize(maskLength);
			applyPendingOrderingIfReady();

			if (incomingGeneration < currentGeneration) {
				resetAccumulatorState(maskLength);
				hideTooltip();
			}

			classifyPopulation(population);
			processedGenerations++;
			currentGeneration = incomingGeneration;

			statusEl.textContent = `Generation ${currentGeneration} | Population ${population.length} | Accumulated in ${processedGenerations} generations`;

			updateCounts();
			updateFocusControls();
			scheduleDraw();
		};

		socket.onerror = function(err) {
			console.error("WebSocket error", err);
			statusEl.textContent = "WebSocket connection error.";
		};

		socket.onclose = function() {
			statusEl.textContent = "WebSocket connection closed.";
		};

		resetAccumulatorState(0);
		updateCounts();
		updateFocusControls();
		refreshLayoutAndDraw();
	</script>
</body>
</html>
